<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Card</title>
    <link rel="stylesheet" href="style14.css">
</head>
<body>
    <div class="login-card">
       <div class="lock-icon">
             🔒
       </div>
       <h1>Login</h1>
       <form>
         <input type="text"
                   placeholder="Username"
                   class="username"
                   required>

            <input type="password"
                   placeholder="Password"
                   class="password"
                   required>

            <button type="submit">Sign In</button>
       </form>
        <a href="forgot-password.html" class="forgot-link">
            Forgot Password?
        </a> 
          <p class="register">
            New user?
            <a href="register.html">Register</a>
        </p>
    </div>
</body>
</html>
