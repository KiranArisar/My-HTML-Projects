<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Task 2</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <label for="name">Full Name:</label>
    <input type="text" name="name" required placeholder="Enter your full name">
    <br><br>
    <label for="phoneNo">Telephone Number:</label>
    <input type="tel" name="phoneNo" required placeholder="Enter your telephone number">
    <br><br>
    <label for="website">Website Url:</label>
    <input type="url" name="website" required placeholder="https://example.com">
     <label>Date of Birth:</label>
    <input type="date">
    <br><br>
     <label>Preferred Time:</label>
    <input type="time" >
    <br><br>
     <label>Address:</label>
    <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
    <br><br>
    <button type="submit">Submit</button>

    <hr>
    <h2>Preformatted Text</h2>

    <pre>
Name: Ali Khan
Class: 4
Section: A
School: City Public School
    </pre>

</body>
</html>
