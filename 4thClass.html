<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
 
 <style>
    body{
      /*  background-color: aquamarine; */
        background-image: url("Images/novapro.jpeg");
   background-repeat: no-repeat;
        
    }
    header {
        background-color: #6fdaf5;
        padding: 20px;
        text-align: center;
        color: rgb(82, 62, 62);
    }
  div {
            margin: 30px 30px 30px 50px;
            padding: 15px 20px 10px 20px;
            border: 2px solid rgb(1, 1, 22);
            background-color:rgb(147, 206, 242);
            height: auto;
          /*  width: 30%; */
          width: 50%;
            text-align: center ;
            
        }  
        form {
            margin: 30px 30px 30px 50px;
            padding: 15px 20px 10px 20px;
            border-style: solid;
            border-width: 2px;  
            border-color: rgb(1, 1, 22);
            background-color: rgb(147, 206, 242);
            width: 50%;
        }
 </style>
</head>
<body>
     <header>
        <h1>Student Registration Portal</h1>
        <p>Register to access our student resources and community.</p>
        <hr>
    </header>
   <div>   
    <h1>Welcome to the Registration Portal</h1>
    <p>Please fill out the form below to register.</p>
    </div> 
     
    <form action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password">
        <br><br>

        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">
        <br><br>

        <label for="age">🎂 Age:</label>
                <input type="number" id="age" name="age"
                       placeholder="Age"
                       min="1" max="120" required>
                <br><br>
                <fieldset>
                    <legend>Gender:</legend>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Hobbies:</legend>
                    <input type="checkbox" id="reading" name="hobbies" value="reading">
                    <label for="reading">Reading</label>

                    <input type="checkbox" id="sports" name="hobbies" value="sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music" name="hobbies" value="music">
                    <label for="music">Music</label>
                    </fieldset>
                    <br>
                    <label for="">Profile Picture:</label>
                    <input type="file" id="profile-picture" name="profile-picture" accept="image/*" required>
<input type="button" value="Submit">
    </form>
    
</body>
</html>
