<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .note::after{
            content: "*";
        }
        .note::before{
            content: "!";
        }
        p::first-line{
            font-size: 30px;
            color: aquamarine;
        }
        p::selection{
            background-color: bisque;
        }
        a[target]{
            color: blueviolet;
            background-color: wheat;
        }
        input[type="text"]{
            border: 2px solid blue;
        }
      a[href$=".pdf"]{
           color:red;
      }

      
      .first{
        opacity: 0.1;
      }
      .second{
        opacity: 0.5;
      }
      .third{
        opacity: 1;
      }
      div{
        position: absolute;
        width: 100px;
        height: 100px;
      }
      .red{
        background-color: red;
        z-index: 1;
      }
      .blue{
        background-color: blue;
        z-index: 2;
      }
      img{
        position: absolute;
        left: 0px;
        right: 0px;
        z-index: -1;
      }
      .h1{
        display: none;
      }
      span{
        background-color: yellow;
        margin: 10px;
      }
      .ex1{
        display: inline-block;
        
      }
      .ex2{
        display: inline;
      }
    </style>
</head>
<body>
