<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        h1 {
            font-family: Arial;
            font-size: 35px;
            font-weight: bold;
            color: blue;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-family: Georgia;
            font-size: 18px;
            font-style: italic;
            line-height: 1.5;
            word-spacing: 5px;
            text-align: justify;
        }
    </style>
</head>
<body>
     <h1>CSS Typography</h1>

    <p>
        CSS typography makes website text more attractive,
        readable and professional. It controls font size,
        spacing, alignment and text appearance.
    </p>
</body>
</html>
