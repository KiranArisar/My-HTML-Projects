<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style13.css">
</head>
<body>
    <div class="gallery-container">
      <header class="gallery-header">
          <h1>Image Gallery</h1>
             <p>Explore the beauty of Nature</p>
      </header>
      <section class="gallery">
        <div class="gallery-card">
            <div class="image-box">
                 <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                         alt="Beautiful mountain landscape">
                    <span class="image-tag">Nature</span>
            </div>
             <div class="caption">
                    <span>❖</span> Mountain Escape
                </div>
        </div>
         <div class="gallery-card">
                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600"
                         alt="Beautiful castle">
                    <span class="image-tag">Architecture</span>
                </div>
                <div class="caption">
                    <span>❖</span> City Lines
                </div>
            </div>
             <div class="gallery-card">
                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?w=600"
                         alt="Waterfall in green forest">
                    <span class="image-tag">Waterfall</span>
                </div>
                <div class="caption">
                    <span>❖</span> Vintage Forest
                </div>
            </div>
 <div class="gallery-card">
                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=600"
                         alt="Wild lion">
                    <span class="image-tag">Wildlife</span>
                </div>
                <div class="caption">
                    <span>❖</span> Wild Beauty
                </div>
            </div>
             <div class="gallery-card">
                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600"
                         alt="Forest and wildlife">
                    <span class="image-tag">Adventure</span>
                </div>
                <div class="caption">
                    <span>❖</span> Light Shapes
                </div>
            </div>
             <div class="gallery-card">
                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                         alt="Beautiful lake and mountains">
                    <span class="image-tag">Landscape</span>
                </div>
                <div class="caption">
                    <span>❖</span> Vintage Lake
                </div>
            </div>

      </section>
      <footer>
        <p>© 2026 Beautiful Image Gallery | Designed with ♥</p>
      </footer>

    </div>
    
</body>
</html>
