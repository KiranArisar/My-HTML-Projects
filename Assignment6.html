<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
    background-color: lightcyan;
    font-family: Arial, sans-serif;
    text-align: center;
          }
        .profile-card {
    width: 300px;
    height: 430px;
    background-color: white;
    border: 2px solid black;
    margin: 50px auto;
    padding: 20px;
    box-sizing: border-box;
}

        .profile-photo {
    width: 120px;
    height: 120px;
    margin: 10px auto;
    border: 2px solid black;
    border-radius: 50%;
    background-image: url("https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300");
    background-size: cover;
    background-position: center;
}
        .profile-card p{
     font-size: 24px;
    margin: 15px 0 5px;
}

        .profile-card h1 {
    font-size: 24px;
    margin: 15px 0 5px;
}


      .profile-card p {
    font-size: 14px;
    line-height: 1.5;
    margin: 15px 0;
}

        

       .profile-card button {
    background-color: teal;
    color: white;
    padding: 10px 20px;
    border: 1px solid black;
    margin-top: 10px;
    cursor: pointer;
    
}

        .profile-card button:hover {
    background-color: darkcyan;
}
.profile-pic {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid teal;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px;
}
    </style>
</head>
<body>
    <div Class="profile-card">
        <div class="profile-image"></div>
            <p>Profile Card</p>
        <h1>KIRAN ARISAR</h1>
        <!-- Profile Picture -->
<img src="profile.jpeg" alt="My Profile Picture" class="profile-pic">
        <h2>Student</h2>
         <p>
            I am passionate about learning new technologies,
            exploring data, and building creative projects.
        </p>
        <a href="profile.html" target="_blank">
         <button>View Profile</button>    
        </a>
        
        </div>
</body>
</html>
